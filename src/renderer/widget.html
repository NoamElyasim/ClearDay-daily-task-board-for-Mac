<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:">
<title>ClearDay</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="widget.css">
</head>
<body>
<!-- ClearDay as a small pill (src/main/widget.mjs). Drag it by its grip or any gap. -->
<form id="w" autocomplete="off" aria-label="ClearDay">
  <span id="w-grip" aria-hidden="true"></span>
  <button type="submit" id="w-add" title="Add the task (Enter)" aria-label="Add task"></button>
  <input id="w-input" type="text" placeholder="Add a task…" spellcheck="false" aria-label="New task">
  <button type="button" id="w-space" data-space="work" title="Adding to Work. Click for Personal" aria-label="Adding to Work. Switch to Personal"></button>
  <button type="button" id="w-list" role="switch" aria-checked="false" title="Adding to To Do. Click for Ongoing" aria-label="Add to Ongoing">
    <span class="knob"></span><span class="opt" data-v="today">To Do</span><span class="opt" data-v="ongoing">Ongoing</span>
  </button>
  <span id="w-count" title="Tasks left today" aria-label="Tasks left today">0</span>
  <button type="button" id="w-expand" title="Open the full board" aria-label="Open the full board"></button>
</form>
<script type="module" src="widget.js"></script>
</body>
</html>
