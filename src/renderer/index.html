<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:">
<title>ClearDay</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="prefs.css">
</head>
<body>
<div id="pane" class="instant">
  <header id="header">
    <div class="date">
      <span id="date"></span>
      <span id="weekday"></span>
    </div>
    <div class="header-actions">
      <button id="theme-btn" class="theme-switch" role="switch" title="Dark mode" aria-label="Dark mode">
        <span class="theme-sun"></span><span class="theme-moon"></span><span class="theme-knob"></span>
      </button>
      <button id="sort-btn" class="icon-btn" title="Sort" aria-label="Sort"></button>
      <button id="settings-btn" class="icon-btn" title="Preferences (⌘,)" aria-label="Preferences"></button>
    </div>
  </header>

  <!-- Two buttons that open into bars: Add a task, and Search. -->
  <div id="bar">
    <form id="add" class="opener" autocomplete="off">
      <button type="button" id="add-open" class="opener-face" title="Add a task (⌘N)">
        <span class="face-icon" id="add-open-icon"></span><span class="face-label">Add a task</span>
      </button>
      <input id="add-input" type="text" placeholder="Add a task…" spellcheck="false" aria-label="New task" tabindex="-1">
      <!-- Today | Ongoing: which list the new task goes into. Starts on Today each time the bar opens. -->
      <button type="button" id="add-list" role="switch" aria-checked="false" title="Today or Ongoing" aria-label="Add to Ongoing" tabindex="-1">
        <span class="knob"></span><span class="opt" data-v="today">Today</span><span class="opt" data-v="ongoing">Ongoing</span>
      </button>
      <button id="add-btn" type="submit" title="Add task (Enter)" aria-label="Add task" tabindex="-1"></button>
    </form>
    <div id="search" class="opener">
      <button type="button" id="search-open" class="opener-face" title="Search (⌘F)" aria-label="Search tasks">
        <span class="face-icon" id="search-icon"></span>
      </button>
      <input id="search-input" type="text" placeholder="Search tasks…" spellcheck="false" aria-label="Search tasks" tabindex="-1">
    </div>
    <div id="search-results" role="listbox" aria-label="Search results"></div>
  </div>

  <main id="main">
    <section id="board" class="panel" aria-label="Board">
      <!-- Level with the first heading: fold every section, and pick tasks to delete. -->
      <div id="board-tools">
        <button id="fold-all-btn" class="tool-btn"><span class="tool-icon"></span><span class="tool-label"></span></button>
        <button id="delete-picked-btn" class="tool-btn danger"><span class="tool-icon"></span><span class="tool-label"></span></button>
        <button id="select-btn" class="tool-btn"><span class="tool-icon"></span><span class="tool-label"></span></button>
      </div>
      <div id="sections"></div>
      <div id="board-empty" class="empty">Nothing on today's board yet.<br>Add a task to start your day.</div>
    </section>

    <aside id="side" class="panel" aria-label="Ongoing and Done">
      <div class="side-tabs" role="tablist" data-active="ongoing">
        <span class="tab-knob"></span>
        <button class="side-tab" data-tab="ongoing" role="tab">
          <span class="title">Ongoing</span><span class="count"></span>
        </button>
        <button class="side-tab" data-tab="done" role="tab">
          <span class="title">Done</span><span class="count"></span>
        </button>
      </div>
      <div class="side-page" data-page="ongoing">
        <div class="side-sections"></div>
        <div class="empty">No ongoing projects yet.<br>With this tab open, add one above.</div>
      </div>
      <div class="side-page" data-page="done">
        <div class="side-tools">
          <button id="clear-done-btn" class="tool-btn"><span class="tool-icon"></span><span class="tool-label">Clear done</span></button>
        </div>
        <div class="list" data-list="" data-status="done"></div>
        <div class="empty">Nothing done yet.<br>Finished tasks gather here.</div>
      </div>
    </aside>

    <div id="side-resizer" role="separator" aria-orientation="vertical" aria-label="Resize the side panel" title="Drag to resize · double-click to reset"></div>

    <button id="sidebar-btn" class="icon-btn" title="Hide the side panel" aria-label="Show or hide the side panel"></button>

    <div id="edge-tabs">
      <button class="edge-tab" data-tab="ongoing" title="Ongoing" aria-label="Show Ongoing">
        <span class="title">Ongoing</span><span class="count"></span>
      </button>
      <button class="edge-tab" data-tab="done" title="Done" aria-label="Show Done">
        <span class="title">Done</span><span class="count"></span>
      </button>
    </div>
  </main>

  <div id="toasts" aria-live="polite"></div>
  <div id="prefs" role="dialog" aria-label="Preferences" aria-hidden="true"></div>
</div>
<div id="popover-layer"></div>
<script type="module" src="app.js"></script>
</body>
</html>
