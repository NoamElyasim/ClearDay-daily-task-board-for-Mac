<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:">
<title>ClearDay quick add</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="quick.css">
</head>
<body>
<form id="q" autocomplete="off" aria-label="Quick add">
  <button type="button" id="q-prio" title="Priority: none" aria-label="Priority: none"><span class="mark"></span></button>
  <input id="q-input" type="text" placeholder="Add a task…" aria-label="New task">
  <button type="button" id="q-space" data-space="work" title="Adding to Work" aria-label="Adding to Work. Switch to Personal"></button>
  <button type="button" id="q-list" role="switch" aria-checked="false" title="To Do or Ongoing" aria-label="Add to Ongoing">
    <span class="knob"></span><span class="opt" data-v="todo">To Do</span><span class="opt" data-v="ongoing">Ongoing</span>
  </button>
  <button type="submit" id="q-add" title="Add (Enter)" aria-label="Add task"></button>
</form>
<script type="module" src="quick.js"></script>
</body>
</html>
