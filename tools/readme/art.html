<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ClearDay README art</title>
<!-- One piece of README art per load: art.html?item=<name> (see main.mjs).
     App pictures are crops of the real UI from tools/shots/out (npm run shots). -->
<style>
@font-face { font-family: Poppins; font-weight: 400; src: url(../../src/renderer/fonts/Poppins-Regular.ttf); }
@font-face { font-family: Poppins; font-weight: 500; src: url(../../src/renderer/fonts/Poppins-Medium.ttf); }
@font-face { font-family: Poppins; font-weight: 600; src: url(../../src/renderer/fonts/Poppins-SemiBold.ttf); }
@font-face { font-family: Poppins; font-weight: 700; src: url(../../src/renderer/fonts/Poppins-Bold.ttf); }
:root { --bg: #272727; --cream: #F5F0E0; --dim: #A9A9AC; --deep: #1B1B1B; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: transparent; overflow: hidden; font-family: Poppins, sans-serif; -webkit-font-smoothing: antialiased; }

/* Feature card, 640 × 480 */
.card { position: absolute; inset: 0; background: var(--bg); border-radius: 28px; overflow: hidden; }
.card h2 { position: absolute; left: 36px; top: 30px; font: 600 44px/1.15 Poppins; color: var(--cream); letter-spacing: -0.01em; }
.card p { position: absolute; left: 36px; top: 88px; font: 400 26px/1.3 Poppins; color: var(--dim); }
.pic { position: absolute; left: 36px; right: 0; top: 156px; bottom: 0; border-radius: 14px 0 0 0; overflow: hidden; background: var(--deep); }
/* a crop of a real shot: --x/--y/--w are the crop's left, top and width in the shot's own px (shots are 860 wide) */
.crop { position: absolute; inset: 0; background-repeat: no-repeat;
  background-size: calc(860px * var(--k)) auto; background-position: calc(var(--x) * -1px * var(--k)) calc(var(--y) * -1px * var(--k)); }

/* Download button, 300 × 72 */
.dl { position: absolute; inset: 0; border-radius: 999px; background: var(--bg); box-shadow: inset 0 0 0 1.5px rgba(245,240,224,.28);
  display: flex; align-items: center; justify-content: center; gap: 12px; color: var(--cream); font: 600 23px/1 Poppins; }
.dl svg { width: 26px; height: 26px; }

/* Social preview, 640 × 320 */
.social { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(180deg, #1E1E1E 0%, #141414 100%); }
.glow { position: absolute; border-radius: 50%; filter: blur(60px); }
</style>
</head>
<body>
<script>
const item = new URLSearchParams(location.search).get('item');
const shot = (n) => `url(../shots/out/${n}.png)`;
const DOWNLOAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10.5 12 15.5l5-5M5 19.5h14"/></svg>';

// A crop of shot n, region starting at (x, y) and w wide, filling a box boxW wide.
function crop(n, x, y, w, boxW = 604, extra = '') {
  return `<div class="crop" style="background-image:${shot(n)};--x:${x};--y:${y};--k:${boxW / w};${extra}"></div>`;
}
function card(title, sub, pic) {
  return `<div class="card"><h2>${title}</h2><p>${sub}</p><div class="pic">${pic}</div></div>`;
}

const ITEMS = {
  'card-claude': () => card('Just tell Claude', 'It runs your board',
    crop('side-hidden-dark', 46, 140, 520) +
    `<div style="position:absolute;right:28px;top:22px;background:var(--cream);color:#272727;border-radius:22px 22px 6px 22px;padding:11px 20px;font:500 24px/1.2 Poppins;box-shadow:0 12px 28px rgba(0,0,0,.5)">plan my day</div>`),
  'card-quick': () => card('Add from any app', '⌘ twice, type, Enter',
    `<div style="position:absolute;inset:0;background:url(../shots/backdrop.webp) center / cover no-repeat;filter:brightness(.6) blur(10px);transform:scale(1.08)"></div>
     <div style="position:absolute;left:241px;top:46px;transform:translateX(-50%);display:flex;gap:14px">
       ${['⌘', '⌘'].map((k) => `<div style="width:76px;height:76px;border-radius:18px;background:var(--cream);color:#272727;display:grid;place-items:center;font:600 40px/1 Poppins;box-shadow:0 5px 0 rgba(0,0,0,.35)">${k}</div>`).join('')}
     </div>
     <div style="position:absolute;left:30px;top:178px;width:542px;height:51px;border-radius:26px;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.45)">
       <div class="crop" style="background-image:${shot('quick-dark')};--x:21;--y:44;--k:${542 / 677};background-size:${720 * 542 / 677}px auto"></div>
     </div>`),
  'card-colour': () => card('Your day in colour', 'Status fills the row', crop('side-hidden-dark', 46, 172, 520)),
  'card-notes': () => card('Rich notes', 'Files, links, formatting', crop('notes-rich-dark', 46, 172, 446)),
  'card-ongoing': () => card('Ongoing projects', 'One tab away', crop('ongoing-dark', 488, 134, 330)),
  'card-search': () => card('Live search', 'Text and notes', crop('search-light', 46, 82, 700)),
  'download': () => `<div class="dl">${DOWNLOAD}<span>Download for Mac</span></div>`,
  'social-preview': () => `<div class="social">
      <div class="glow" style="width:420px;height:300px;left:-120px;top:-150px;background:rgba(205,141,0,.30)"></div>
      <div class="glow" style="width:380px;height:280px;right:-80px;bottom:-160px;background:rgba(86,118,141,.40)"></div>
      <div style="position:absolute;left:330px;top:46px;width:430px;height:320px;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 30px 70px rgba(0,0,0,.6)">
        <div class="crop" style="background-image:${shot('side-hidden-dark')};--x:40;--y:40;--k:${430 / 780};background-size:${860 * 430 / 780}px auto"></div>
      </div>
      <img src="../../build/icon.png" style="position:absolute;left:30px;top:44px;width:118px;height:118px">
      <div style="position:absolute;left:44px;top:168px;font:700 52px/1 Poppins;color:#fff;letter-spacing:-0.03em">ClearDay</div>
      <div style="position:absolute;left:44px;top:232px;width:262px;font:400 17px/1.4 Poppins;color:var(--cream)">Your whole day on one small board that floats on your Mac.</div>
    </div>`,
};

document.body.innerHTML = ITEMS[item]();
// main.mjs waits for this before capturing
window.artReady = Promise.all([document.fonts.ready,
  ...[...document.images].map((i) => i.decode().catch(() => {})),
  ...[...document.querySelectorAll('.crop, [style*="url("]')].map((el) => {
    const m = getComputedStyle(el).backgroundImage.match(/url\("?([^")]+)"?\)/);
    if (!m) return null;
    const img = new Image(); img.src = m[1]; return img.decode().catch(() => {});
  })]);
</script>
</body>
</html>
